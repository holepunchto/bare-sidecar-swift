name: Prebuild
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release to prebuild
        required: true
permissions:
  contents: read
jobs:
  prebuild:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Build / ${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          prefix: Bare.artifactbundle
          upload: true
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: prebuild
    name: Release
    steps:
      - uses: holepunchto/actions/checkout@v1
      - uses: holepunchto/actions/download-prebuilds@v1
        with:
          prefix: Bare.artifactbundle
      - id: bundle
        uses: holepunchto/actions/create-artifact-bundle@v1
        with:
          path: Bare.artifactbundle
      - uses: holepunchto/actions/create-github-release@v1
        with:
          draft: true
          tag: ${{ inputs.tag }}
          files: ${{ steps.bundle.outputs.path }}
